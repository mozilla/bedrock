<div class="m24-c-longform">
  <figure class="m24-c-longform-figure">
    {{ srcset_image(
      value.image.image,
      "width-{400,600,800,1000,1200,1400,1600,1800}",
      sizes="(min-width: 1440px) 564px, (min-width: 1312px) calc(41.67vw - 36px), (min-width: 1024px) calc(41.67vw - 27px), (min-width: 768px) calc(66.67vw - 36px), calc(100vw - 32px)",
      alt=value.image.image_alt if value.image.image_alt else "",
      loading="lazy",
      class="m24-c-longform-figure-image"
    ) }}
    {% if value.caption %}
      <figcaption class="m24-c-longform-figure-text">{{ value.caption|richtext }}</figcaption>
    {% endif %}
  </figure>
</div>
