[dependency-groups]
dev = [
    "braceexpand==0.1.7",
    "django-silk==5.6.0",
    "factory-boy==3.3.3",
    "freezegun==1.5.5",
    "markdown-it-py>=4.2.0",
    "py==1.11.0",
    "pyquery==2.1.0",
    "pytest==9.1.1",  # Included because we use it directly
    "pytest-base-url==2.1.0",  # Provides the --base-url option and base_url fixture used by our HTTP integration tests
    "pytest-cov==7.1.0",
    "pytest-datadir==1.8.0",
    "pytest-django==4.14.0",
    "pytest-html==4.2.0",  # Provides the --html option used to generate the integration test report
    "pytest-mock==3.16.0",
    "pytest-parallel==0.1.1",
    "pytest-rerunfailures==16.7",
    "responses==0.26.3",
    "ruff==0.17.0",
    "selenium==4.51.0",
    "translate-toolkit==3.20.0",
    "wagtail-factories==4.5.0",
    # Related to moz-l10n-lint, used in CI
    "cl-ext.lang==0.1.0",
    "compare-locales==9.0.5",
]
docs = [
    "mkdocs-material==9.7.7",
]

[tool.uv]
# Bedrock is an application, not an installable package
package = false
# Floor matches the `ghcr.io/astral-sh/uv` image in `Dockerfile`. uv carries its own CA roots for
# PyPI fetches, so an older local uv would resolve and lock against a stale trust store.
required-version = ">=0.13.5"
# The dev image and local installs also get the docs tooling
default-groups = ["dev", "docs"]
# Avoids packages uploaded in the last 7 days, reducing supply-chain risk. Dependabot's
# `cooldown` in `.github/dependabot.yml` matches it. This also blocks Dependabot security
# updates to a release younger than 7 days.
#
# To apply an urgent fix sooner (e.g. a Django security release):
#   1. Bump the pin above.
#   2. Exempt just that package by adding `exclude-newer-package = { django = false }` under `exclude-newer`.
#   3. Run `uv lock`, which only re-resolves the changed package. Commit both files.
#   4. Once the release is 7 days old, remove the exemption and run `uv lock` again.
exclude-newer = "7 days"
# Temporary: certifi 2026.10.19 drops the compromised eMudhra intermediates, so skip the
# cooldown for it. Remove this line on or after 2026-10-28 (the release was uploaded late on
# 2026-10-20 UTC) and run `uv lock`, then check certifi is still 2026.10.19.
exclude-newer-package = { certifi = false }

[tool.ruff]
line-length = 150
target-version = 'py313'
extend-exclude = ["docs", "assets", "static", "bedrock/externalfiles/files_cache", "*/migrations/*"]

[tool.ruff.lint]
# Set what ruff should check for.
# See https://beta.ruff.rs/docs/rules/ for a list of rules.
select = [
    # TODO: Enable flake8-builtin and fix errors to fix variable name shadowing errors.
    # "A", # flake8-builtin errors.
    # TODO: Enable bugbear and fix errors.
    # "B", # bugbear errors
    "DJ", # flake8-django errors.
    "E", # pycodestyle errors
    "F", # pyflakes errors
    "I", # import sorting
    "Q", # flake8-quotes errors
    "W", # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"bedrock/settings/__init__.py" = ["F405"]

[tool.ruff.lint.isort]
known-first-party = ["bedrock", "lib", "pages"]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]
combine-as-imports = true

[tool.ruff.lint.isort.sections]
django = ["django"]
