name: "SSDLC: Generate SBOM"

# Release SBOMs are generated by generate-gh-release-note.yml, right after it creates the
# release. A `release: published` trigger here would never fire, because that release is
# created with the workflow's own GITHUB_TOKEN, and events caused by GITHUB_TOKEN do not
# start other workflows.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Default to no permissions; the sbom job grants only what it needs.
permissions: {}

jobs:
  sbom:
    name: Generate SBOM
    permissions:
      contents: write # Submit the SBOM to the dependency graph
      actions: read # Let the reusable workflow upload the SBOM as a workflow artifact
    uses: mozilla/ssdlc-actions/.github/workflows/ssdlc-sbom.yml@5e1ea380f75b02891de776dcc00e74ad7cfeca9c # v1.3
    with:
      sbom_name: ${{ github.sha }}
