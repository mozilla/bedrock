name: Generate GitHub Release entry

# Default to no permissions; jobs grant only what they need.
permissions: {}

on:
  push:
    # YYYY-MM-DD or YYYY-MM-DD.integer for times when there are multiple releases in a day
    # (Repetition here is safer than a wildcard glob)
    tags:
      - '20[0-9][0-9]-[01][0-9]-[0-3][0-9]'
      - '20[0-9][0-9]-[01][0-9]-[0-3][0-9].[0-9]'
      - '20[0-9][0-9]-[01][0-9]-[0-3][0-9].[0-9][0-9]'
      - '20[0-9][0-9]-[01][0-9]-[0-3][0-9].[0-9][0-9][0-9]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max # keep every pending run, not just the newest

jobs:
  create-release:
    name: Generate GitHub Release entry
    runs-on: ubuntu-slim
    if: github.repository == 'mozilla/bedrock'
    permissions:
      contents: write # Create the GitHub Release for the tag
    outputs:
      tag_name: ${{ steps.validate.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate tag format
        id: validate
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"

          # Validate tag matches production format YYYY-MM-DD or YYYY-MM-DD.integer
          if [[ $TAG_NAME =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[0-9]{1,3})?$ ]]; then
            echo "Current tag: $TAG_NAME"
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          else
            echo "Tag does not match production format, skipping release creation"
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Create GitHub Release
        if: steps.validate.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.validate.outputs.tag_name }}
        run: |

          # Create the release with auto-generated notes
          gh release create "$CURRENT_TAG" \
            --title "Production Release $CURRENT_TAG" \
            --generate-notes \
            --verify-tag

          echo "✅ Successfully created release for $CURRENT_TAG"

  # Runs here rather than from a `release: published` trigger: the release above is created
  # with GITHUB_TOKEN, and events caused by GITHUB_TOKEN never start other workflows.
  # The SBOM action finds the release for the pushed tag and attaches the SBOM to it.
  sbom:
    name: Generate SBOM for release
    needs: create-release
    if: needs.create-release.outputs.tag_name != ''
    permissions:
      contents: write # Upload the SBOM as a release asset and submit it to the dependency graph
      actions: read # Let the reusable workflow upload the SBOM as a workflow artifact
    uses: mozilla/ssdlc-actions/.github/workflows/ssdlc-sbom.yml@5e1ea380f75b02891de776dcc00e74ad7cfeca9c # v1.3
    with:
      sbom_name: ${{ needs.create-release.outputs.tag_name }}
