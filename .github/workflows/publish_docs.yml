name: Publish documentation

on:
  workflow_dispatch: # allow manual runs
  push:
    branches:
      - main
    paths: # only build on relevant changes
      - docs/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/publish_docs.yml

# Default to read-only; the deploy job grants only what it needs.
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false # skip any intermediate builds but let finish

jobs:
  build:
    name: Build documentation
    if: github.repository == 'mozilla/bedrock'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site config for the base URL
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Keep in sync with the `ghcr.io/astral-sh/uv` image in `Dockerfile`
          version: 0.13.5
          python-version: 3.13
          activate-environment: true
          enable-cache: false
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: uv sync --locked --only-group docs
      - run: cd docs && mkdocs build -d site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./docs/site
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write # Deploy the built site to GitHub Pages
      id-token: write # deploy-pages verifies the artifact's provenance with an OIDC token
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
