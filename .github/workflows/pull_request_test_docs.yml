name: Test documentation build

permissions:
  contents: read

on:
  workflow_dispatch: # allow manual runs
  pull_request:
    paths: # only build on relevant changes
      - docs/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/pull_request_test_docs.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Keep in sync with the `ghcr.io/astral-sh/uv` image in `Dockerfile`
          version: 0.13.5
          python-version: 3.13
          activate-environment: true
          enable-cache: false
      - run: uv sync --locked --only-group docs
      - run: cd docs && mkdocs build --strict
