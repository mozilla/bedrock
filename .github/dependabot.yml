version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    labels:
      - Backend
      - dependencies
  - package-ecosystem: uv
    directory: '/'
    ignore:
      # Need to be kept in sync with pre-commit-config.yaml.
      - dependency-name: 'ruff'
    schedule:
      interval: monthly
    # Matches `exclude-newer` in `pyproject.toml`, so Dependabot never proposes a version uv refuses to lock
    cooldown:
      default-days: 7
    groups:
      backend:
        dependency-type: production
        update-types:
          - 'minor'
          - 'patch'
      backend-dev-dependencies:
        dependency-type: development
        update-types:
          - 'minor'
          - 'patch'
    open-pull-requests-limit: 10
    labels:
      - Backend
      - dependencies
  - package-ecosystem: npm
    directory: '/'
    ignore:
      # Owned NPM packages that require manual testing.
      - dependency-name: '@mozilla-protocol/core'
      - dependency-name: '@mozmeao/consent-banner'
      - dependency-name: '@mozmeao/cookie-helper'
      - dependency-name: '@mozmeao/dnt-helper'
      - dependency-name: '@mozmeao/trafficcop'
      # Pin sass at 1.91.0 until mozilla/protocol#982
      - dependency-name: 'sass'
      # (related to above sass version) Avoid unrelated @parcel changes in dep updates
      - dependency-name: '@parcel/watcher*'
      # Need to be kept in sync with pre-commit-config.yaml.
      - dependency-name: 'eslint'
      - dependency-name: 'eslint-config-prettier'
      - dependency-name: 'prettier'
      - dependency-name: 'stylelint'
      - dependency-name: 'stylelint-config-standard-scss'
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      frontend:
        dependency-type: production
        update-types:
          - 'minor'
          - 'patch'
      dev-dependencies:
        dependency-type: development
        update-types:
          - 'minor'
          - 'patch'
    open-pull-requests-limit: 10
    labels:
      - Frontend
      - dependencies
  - package-ecosystem: npm
    directory: '/tests/playwright'
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 10
    groups:
      playwright:
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - Frontend
      - dependencies
